name: Ingestão Senado Federal

# Cobre: votações nominais.
#
# Votações: semanal (3ª-feira) — complementa o workflow da Câmara (2ª-feira)
#
# O módulo CEAPS foi removido em 03/09/2026 — alimentava
# `senado_ceaps_despesa`, tabela que nenhuma página do site lê (fonte
# diferente da usada por /senate-expenses, que vem de outro pipeline em
# br-insider-main/packages/ingestao-portal). Rodava com sucesso todo mês
# sem nenhum efeito visível no site — puro desperdício de CI.

on:
  schedule:
    - cron: "0 7 * * 2"    # semanal 3ª-feira, 07:00 UTC
  workflow_dispatch:
    inputs:
      data_inicio:
        description: "Início período votações (YYYY-MM-DD)"
        default: ""
      data_fim:
        description: "Fim período votações (YYYY-MM-DD)"
        default: ""

concurrency:
  group: ingest-senado
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r ingestao/requirements.txt

      - name: Calcular parâmetros
        id: cfg
        run: |
          if [ -n "${{ github.event.inputs.data_inicio }}" ]; then
            DATA_INI="${{ github.event.inputs.data_inicio }}"
            DATA_FIM="${{ github.event.inputs.data_fim }}"
            [ -z "$DATA_FIM" ] && DATA_FIM=$(date +%Y-%m-%d)
          else
            DATA_INI=$(date -d '14 days ago' +%Y-%m-%d 2>/dev/null || date -v-14d +%Y-%m-%d)
            DATA_FIM=$(date +%Y-%m-%d)
          fi

          echo "data_ini=$DATA_INI"  >> $GITHUB_OUTPUT
          echo "data_fim=$DATA_FIM"  >> $GITHUB_OUTPUT

      - name: Ingerir Votações
        run: |
          python -m ingestao.senado \
            --modulos votacoes \
            --data-inicio ${{ steps.cfg.outputs.data_ini }} \
            --data-fim    ${{ steps.cfg.outputs.data_fim }}
