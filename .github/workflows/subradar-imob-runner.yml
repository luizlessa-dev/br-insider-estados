name: Subradar Imob - Entrega de Dossiê

# A entrega saiu deste workflow e passou para dentro do runner
# (ingestao/subradar/entrega_imob.py). O passo antigo "Notificar cliente por
# email" rodava com `if: success()`: bastava o Python terminar com código 0
# para o e-mail sair, mesmo que nenhuma fonte tivesse respondido. Hoje quem
# decide enviar é a trava de completude, não o exit code.

on:
  workflow_dispatch:
    inputs:
      matricula:
        description: "Matrícula do imóvel (formato: NNNNNN-D.DD.DDDD.D.DDDDD)"
        required: true
      cartorio_id:
        description: "ID CNIB do cartório (ex: 0123)"
        required: false
      email_cliente:
        description: "E-mail do cliente para entrega do dossiê"
        required: true
      consulta_id:
        description: "UUID da consulta"
        required: true

concurrency:
  group: subradar-imob-${{ github.event.inputs.consulta_id }}
  cancel-in-progress: false

jobs:
  rodar-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: pip install -r ingestao/requirements.txt

      - name: Executar pipeline Imob e entregar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # A fonte judicial consulta o BigDataCorp pelo CPF/CNPJ do
          # proprietário. Sem estes dois secrets a seção sai "pendente" e a
          # entrega é retida — que é o comportamento correto, mas inútil.
          BIGDATA_CORP_TOKEN_ID: ${{ secrets.BIGDATA_CORP_TOKEN_ID }}
          BIGDATA_CORP_ACCESS_TOKEN: ${{ secrets.BIGDATA_CORP_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUBRADAR_FROM: ${{ secrets.SUBRADAR_FROM }}
          SUBRADAR_OPERADOR: ${{ secrets.SUBRADAR_OPERADOR }}
          SUBRADAR_BASE_URL: ${{ secrets.SUBRADAR_BASE_URL }}
        run: |
          python3 -m ingestao.subradar.runner_imob \
            --matricula "${{ github.event.inputs.matricula }}" \
            --cartorio-id "${{ github.event.inputs.cartorio_id }}" \
            --consulta-id "${{ github.event.inputs.consulta_id }}" \
            --email-cliente "${{ github.event.inputs.email_cliente }}"

      - name: Registrar falha na consulta
        if: failure()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # O runner já grava status=erro nas falhas que consegue capturar.
          # Este passo cobre o resto (timeout do job, falha de dependência),
          # senão o pedido ficaria "processando" para sempre.
          python3 - <<'PY'
          import os, requests
          url = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          requests.patch(
              f"{url}/rest/v1/sub_imob_consultas",
              headers={"apikey": key, "Authorization": f"Bearer {key}",
                       "Content-Type": "application/json"},
              params={"id": "eq.${{ github.event.inputs.consulta_id }}",
                      "status": "eq.processando"},
              json={"status": "erro",
                    "mensagem_erro": "Job do GitHub Actions falhou — ver run ${{ github.run_id }}"},
              timeout=30,
          )
          PY
