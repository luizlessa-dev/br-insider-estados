name: Subradar PF - Entrega de Dossiê

on:
  workflow_dispatch:
    inputs:
      cpf:
        description: "CPF do consultado (somente dígitos)"
        required: true
      nome:
        description: "Nome completo do consultado"
        required: true
      tipo:
        description: "Tipo de consulta: simples ou completa"
        required: true
        default: "simples"
      email_cliente:
        description: "E-mail do cliente para entrega do dossiê"
        required: true
      consulta_id:
        description: "UUID da consulta"
        required: true

concurrency:
  group: subradar-pf-${{ github.event.inputs.consulta_id }}
  cancel-in-progress: false

jobs:
  rodar-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: pip install -r ingestao/requirements.txt

      - name: Executar pipeline PF
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BIGDATA_CORP_TOKEN: ${{ secrets.BIGDATA_CORP_TOKEN }}
          ESCAVADOR_TOKEN: ${{ secrets.ESCAVADOR_TOKEN }}
          DIRECT_DATA_TOKEN: ${{ secrets.DIRECT_DATA_TOKEN }}
          OPENSANCTIONS_PRO_KEY: ${{ secrets.OPENSANCTIONS_PRO_KEY }}
          INFOSIMPLES_TOKEN: ${{ secrets.INFOSIMPLES_TOKEN }}
        run: |
          AVULSA_FLAG=""
          if [ "${{ github.event.inputs.tipo }}" = "completa" ]; then
            AVULSA_FLAG="--avulsa"
          fi
          python3 -m ingestao.subradar.runner_pf \
            --cpf "${{ github.event.inputs.cpf }}" \
            --nome "${{ github.event.inputs.nome }}" \
            --cliente-id "${{ github.event.inputs.consulta_id }}" \
            $AVULSA_FLAG

      - name: Enviar email com Resend
        if: success()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 .github/scripts/send_dossiee_resend.py "${{ github.event.inputs.cpf }}" "${{ github.event.inputs.nome }}" "${{ github.event.inputs.tipo }}" "${{ github.event.inputs.email_cliente }}" "${{ github.event.inputs.consulta_id }}"
