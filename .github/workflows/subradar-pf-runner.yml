name: Subradar PF — Entrega de Dossiê

on:
  workflow_dispatch:
    inputs:
      cpf:
        description: "CPF do consultado (somente dígitos)"
        required: true
      nome:
        description: "Nome completo do consultado"
        required: true
      tipo:
        description: "Tipo de consulta: simples ou completa"
        required: true
        default: "simples"
      email_cliente:
        description: "E-mail do cliente para entrega do dossiê"
        required: true
      consulta_id:
        description: "UUID da consulta em sub_pf_consultas"
        required: true

concurrency:
  group: subradar-pf-${{ github.event.inputs.consulta_id }}
  cancel-in-progress: false

jobs:
  rodar-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: pip install -r ingestao/requirements.txt

      - name: Executar pipeline PF
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BIGDATA_CORP_TOKEN: ${{ secrets.BIGDATA_CORP_TOKEN }}
          ESCAVADOR_TOKEN: ${{ secrets.ESCAVADOR_TOKEN }}
          DIRECT_DATA_TOKEN: ${{ secrets.DIRECT_DATA_TOKEN }}
          OPENSANCTIONS_PRO_KEY: ${{ secrets.OPENSANCTIONS_PRO_KEY }}
          INFOSIMPLES_TOKEN: ${{ secrets.INFOSIMPLES_TOKEN }}
        run: |
          AVULSA_FLAG=""
          if [ "${{ github.event.inputs.tipo }}" = "completa" ]; then
            AVULSA_FLAG="--avulsa"
          fi

          python3 -m ingestao.subradar.runner_pf \
            --cpf "${{ github.event.inputs.cpf }}" \
            --nome "${{ github.event.inputs.nome }}" \
            --cliente-id "${{ github.event.inputs.consulta_id }}" \
            $AVULSA_FLAG \
            2>&1 | tee /tmp/pf_output.txt

          echo "EXIT_CODE=${PIPESTATUS[0]}" >> $GITHUB_ENV

      - name: Marcar consulta como concluída no Supabase
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          STATUS="concluida"
          if [ "$EXIT_CODE" != "0" ]; then STATUS="erro"; fi
          python3 - <<'EOF'
          import os, requests
          url = os.environ["SUPABASE_URL"]
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          consulta_id = "${{ github.event.inputs.consulta_id }}"
          status = "$STATUS" if "$STATUS" != "" else "concluida"
          requests.patch(
              f"{url}/rest/v1/sub_pf_consultas?id=eq.{consulta_id}",
              json={"status": status},
              headers={"apikey": key, "Authorization": f"Bearer {key}", "Content-Type": "application/json"},
          )
          EOF

      - name: Enviar dossiê por e-mail (Resend)
        if: env.EXIT_CODE == '0'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 - <<'PYEOF'
          import os, requests
          from datetime import date

          cpf_raw  = "${{ github.event.inputs.cpf }}"
          cpf_fmt  = f"{cpf_raw[:3]}.{cpf_raw[3:6]}.{cpf_raw[6:9]}-{cpf_raw[9:11]}"
          nome     = "${{ github.event.inputs.nome }}"
          tipo     = "${{ github.event.inputs.tipo }}"
          email_cliente = "${{ github.event.inputs.email_cliente }}"
          consulta_id   = "${{ github.event.inputs.consulta_id }}"
          ciclo = date.today().strftime("%Y-%m")

          SB_URL = os.environ["SUPABASE_URL"]
          SB_KEY = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          hdrs   = {"apikey": SB_KEY, "Authorization": f"Bearer {SB_KEY}"}

          def sb_get(table, params):
              r = requests.get(f"{SB_URL}/rest/v1/{table}", params=params, headers=hdrs, timeout=20)
              return r.json() if r.ok else []

          # Buscar resultado (score)
          resultados = sb_get("sub_pf_resultados", {"cpf": f"eq.{cpf_fmt}", "ciclo": f"eq.{ciclo}", "limit": 1})
          resultado  = resultados[0] if resultados else {}
          score      = resultado.get("score_risco", 0)
          faixa      = resultado.get("faixa_risco", "desconhecida")

          # Buscar dados estruturados
          dados = sb_get("sub_pf_dados", {"cpf": f"eq.{cpf_fmt}", "ciclo": f"eq.{ciclo}", "limit": 100})

          # Buscar alertas
          alertas = sb_get("sub_pf_alertas", {"cpf": f"eq.{cpf_fmt}", "ciclo": f"eq.{ciclo}", "limit": 200})
          n_criticos = sum(1 for a in alertas if a.get("severidade") == "critico")
          n_atencao  = sum(1 for a in alertas if a.get("severidade") == "atencao")

          # Cores por status
          CORES = {"limpo": "#16a34a", "alerta": "#d97706", "critico": "#dc2626",
                   "pendente": "#6366f1", "nao_aplicavel": "#94a3b8", "erro": "#94a3b8"}
          LABELS = {"limpo": "Sem ocorrências", "alerta": "Atenção", "critico": "Crítico",
                    "pendente": "Pendente", "nao_aplicavel": "N/A", "erro": "Erro"}
          CATEGORIAS_ORDEM = [
              ("cadastral",       "Dados Cadastrais"),
              ("societario",      "Vínculos Societários"),
              ("judicial",        "Judicial e Penal"),
              ("trabalhista",     "Trabalhista"),
              ("sancao",          "Sanções e Restrições"),
              ("financeiro",      "Crédito e Finanças"),
              ("dou",             "Diários Oficiais"),
              ("controle",        "Controle Externo"),
              ("mercado_capitais","Mercado de Capitais"),
              ("reputacao",       "Reputação e Mídia"),
              ("internacional",   "Listas Internacionais"),
          ]

          # Índice de alertas por categoria
          alertas_por_cat = {}
          for a in alertas:
              cat = a.get("categoria", "outro")
              alertas_por_cat.setdefault(cat, []).append(a)

          # Índice de dados por categoria
          dados_por_cat = {}
          for d in dados:
              cat = d.get("categoria", "outro")
              dados_por_cat.setdefault(cat, []).append(d)

          def badge(status):
              cor  = CORES.get(status, "#94a3b8")
              txt  = LABELS.get(status, status)
              return f'<span style="display:inline-block;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:700;background:{cor}22;color:{cor};border:1px solid {cor}44">{txt}</span>'

          def alerta_pill(sev):
              cor = CORES.get(sev, "#94a3b8")
              return f'<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:{cor};margin-right:6px;flex-shrink:0"></span>'

          secoes_html = ""
          for cat_key, cat_label in CATEGORIAS_ORDEM:
              cat_dados   = dados_por_cat.get(cat_key, [])
              cat_alertas = alertas_por_cat.get(cat_key, [])
              if not cat_dados and not cat_alertas:
                  continue

              linhas = ""
              seen_fontes = set()
              for d in cat_dados:
                  fonte = d.get("fonte", "")
                  seen_fontes.add(fonte)
                  st    = d.get("status", "limpo")
                  titulo = d.get("titulo_secao", fonte)
                  resumo = d.get("resumo", "")
                  linhas += f"""
                  <tr>
                    <td style="padding:10px 0;border-bottom:1px solid #f1f5f9;vertical-align:top">
                      <span style="font-size:13px;font-weight:600;color:#1e293b">{titulo}</span>
                      <br><span style="font-size:12px;color:#64748b">{resumo}</span>
                    </td>
                    <td style="padding:10px 0 10px 12px;border-bottom:1px solid #f1f5f9;vertical-align:top;white-space:nowrap">
                      {badge(st)}
                    </td>
                  </tr>"""

              # Alertas detalhados para categorias com ocorrências
              detalhes_alertas = ""
              for a in cat_alertas:
                  sev   = a.get("severidade", "info")
                  titulo_a = a.get("titulo", "")
                  desc_a   = a.get("descricao", "")
                  detalhes_alertas += f"""
                  <div style="display:flex;align-items:flex-start;margin-bottom:10px">
                    {alerta_pill(sev)}
                    <div>
                      <p style="margin:0;font-size:13px;font-weight:600;color:#1e293b">{titulo_a}</p>
                      <p style="margin:2px 0 0;font-size:12px;color:#64748b;line-height:1.5">{desc_a}</p>
                    </div>
                  </div>"""

              secoes_html += f"""
              <div style="margin-bottom:24px">
                <h3 style="margin:0 0 12px;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#94a3b8">{cat_label}</h3>
                <table style="width:100%;border-collapse:collapse">{linhas}</table>
                {('<div style="margin-top:12px;padding:12px;background:#fef2f2;border-radius:6px">' + detalhes_alertas + '</div>') if detalhes_alertas else ''}
              </div>"""

          # Score badge
          if score >= 70:
              score_cor = "#dc2626"; score_label = "Risco Alto"
          elif score >= 40:
              score_cor = "#d97706"; score_label = "Risco Médio"
          else:
              score_cor = "#16a34a"; score_label = "Risco Baixo"

          resumo_banner = ""
          if n_criticos:
              resumo_banner = f'<div style="padding:16px;border-radius:8px;background:#fef2f2;border-left:4px solid #dc2626;margin-bottom:28px"><p style="margin:0;font-weight:700;color:#dc2626">{n_criticos} alerta(s) crítico(s) encontrado(s)</p><p style="margin:4px 0 0;font-size:13px;color:#991b1b">Recomenda-se revisão detalhada antes de prosseguir com o vínculo.</p></div>'
          elif n_atencao:
              resumo_banner = f'<div style="padding:16px;border-radius:8px;background:#fffbeb;border-left:4px solid #d97706;margin-bottom:28px"><p style="margin:0;font-weight:700;color:#d97706">{n_atencao} ponto(s) de atenção identificado(s)</p><p style="margin:4px 0 0;font-size:13px;color:#92400e">Analise os itens destacados antes de finalizar a decisão.</p></div>'
          else:
              resumo_banner = '<div style="padding:16px;border-radius:8px;background:#f0fdf4;border-left:4px solid #16a34a;margin-bottom:28px"><p style="margin:0;font-weight:700;color:#16a34a">Nenhuma ocorrência encontrada</p><p style="margin:4px 0 0;font-size:13px;color:#166534">O CPF consultado não apresentou alertas nas fontes verificadas.</p></div>'

          html = f"""<!DOCTYPE html>
          <html><body style="margin:0;padding:20px;background:#f8fafc;font-family:system-ui,-apple-system,sans-serif">
          <div style="max-width:600px;margin:auto">
            <div style="background:#0f172a;padding:28px 32px;border-radius:10px 10px 0 0">
              <p style="color:#94a3b8;font-size:10px;letter-spacing:2.5px;text-transform:uppercase;margin:0 0 6px">SUBRADAR · COMPLIANCE PESSOAL</p>
              <h1 style="color:#fff;font-size:22px;margin:0 0 4px">{nome}</h1>
              <p style="color:#64748b;font-size:13px;margin:0">CPF {cpf_fmt} · Consulta {tipo.title()} · {date.today().strftime("%d/%m/%Y")}</p>
            </div>
            <div style="background:#fff;padding:32px;border:1px solid #e2e8f0;border-top:none;border-radius:0 0 10px 10px">
              <div style="display:flex;align-items:center;gap:16px;margin-bottom:28px;padding:16px;background:#f8fafc;border-radius:8px">
                <div style="text-align:center;min-width:64px">
                  <p style="margin:0;font-size:32px;font-weight:900;color:{score_cor}">{score}</p>
                  <p style="margin:0;font-size:10px;font-weight:700;color:{score_cor};letter-spacing:1px">{score_label.upper()}</p>
                </div>
                <div>
                  <p style="margin:0 0 2px;font-size:13px;font-weight:700;color:#1e293b">Score de Risco Subradar</p>
                  <p style="margin:0;font-size:12px;color:#64748b">Faixa: {faixa} · {len(dados)} fontes com dados estruturados · {len(alertas)} alerta(s) total</p>
                </div>
              </div>
              {resumo_banner}
              {secoes_html}
              <p style="font-size:11px;color:#94a3b8;border-top:1px solid #f1f5f9;padding-top:20px;margin:0;line-height:1.6">
                Dossiê gerado automaticamente pelo Subradar em {date.today().strftime("%d/%m/%Y")}.<br>
                As informações são obtidas de fontes públicas e bases de dados autorizadas. O Subradar não substitui análise jurídica.<br>
                Lessa Labs Tecnologia Ltda · CNPJ 65.659.055/0001-53 · <a href="mailto:luiz@lessalabs.com" style="color:#64748b">luiz@lessalabs.com</a>
              </p>
            </div>
          </div>
          </body></html>"""

          assunto_alertas = f"{n_criticos} crítico(s)" if n_criticos else (f"{n_atencao} atenção" if n_atencao else "sem ocorrências")
          subject = f"Subradar PF — {nome} · {assunto_alertas} · Score {score}"

          # Enviar via Resend
          resend_api_key = os.environ.get("RESEND_API_KEY", "")
          if not resend_api_key:
              raise ValueError("RESEND_API_KEY não configurada")

          payload = {
              "from": "retorno@subradar.com.br",
              "to": email_cliente,
              "subject": subject,
              "html": html,
              "reply_to": "luiz@lessalabs.com",
          }

          resp = requests.post(
              "https://api.resend.com/emails",
              json=payload,
              headers={"Authorization": f"Bearer {resend_api_key}"},
              timeout=30,
          )

          if resp.ok:
              print(f"Dossiê enviado para {email_cliente} (score={score}, criticos={n_criticos})")
          else:
              raise Exception(f"Resend error: {resp.status_code} — {resp.text}")
          PYEOF

      - name: Notificar erro ao operador
        if: env.EXIT_CODE != '0'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          python3 << 'ERREOF'
          import os, requests
          with open("/tmp/pf_output.txt") as f:
              log = f.read()[-3000:]

          body_text = "Pipeline PF falhou.\n\nID: ${{ github.event.inputs.consulta_id }}\nCPF: ${{ github.event.inputs.cpf }}\n\nLog:\n" + log

          resend_api_key = os.environ.get("RESEND_API_KEY", "")
          if resend_api_key:
              payload = {
                  "from": "retorno@subradar.com.br",
                  "to": "luiz@lessalabs.com",
                  "subject": "[Subradar PF] ERRO — pipeline falhou",
                  "text": body_text,
              }
              requests.post(
                  "https://api.resend.com/emails",
                  json=payload,
                  headers={"Authorization": f"Bearer {resend_api_key}"},
                  timeout=30,
              )
          ERREOF
