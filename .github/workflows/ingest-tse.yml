name: Ingestão TSE

# Cadência: anual, após cada eleição (dados ficam estáticos pós-resultado).
#
# Calendário eleitoral brasileiro:
#   Anos terminados em 2 (2022, 2026…): eleições GERAIS
#     → cargos 1,3,5,6,7 (Presidente, Governador, Senador, Dep. Federal, Dep. Estadual)
#     → seed: python -m ingestao.tse.runner --dataset todos --ano <ano>
#
#   Anos terminados em 4 (2024, 2028…): eleições MUNICIPAIS
#     → cargos 11,12 (Prefeito, Vice-Prefeito; vereadores omitidos — >500k registros)
#     → seed: python -m ingestao.tse.runner --dataset todos --ano <ano>
#
# Volume estimado por ano:
#   candidatos: ~30k (gerais) | ~80k (municipais, só Prefeito+VP)
#   receitas:   ~500k registros
#   despesas:   ~600k registros
#
# Tempo estimado: ~10-20min por dataset/ano (download ZIP + delete + insert)
#
# ─────────────────────────────────────────────────────────────────────────────
# CONTENÇÃO EMERGENCIAL ENCERRADA (2026-08-24)
#
# Histórico: em 2026-07-16 receitas/despesas foram suspensas porque o caminho
# antigo usava delete-before-load — apagava o ano na tabela final ANTES de
# baixar o ZIP do TSE. Em 2026-06-20 o CDN do TSE ficou indisponível: os
# deletes de 2014/2018 rodaram e os downloads falharam, deixando os anos sem
# reposição.
#
# Reativado após homologação completa do pipeline seguro (staging + fingerprint
# + swap atômico + advisory lock + COPY) — ver ingestao/tse/HOMOLOGACAO.md,
# 12/12 critérios aprovados em 2026-08-23/24, migration 0001_tse_safe_pipeline.sql
# aplicada em produção em 2026-08-24. O runner (ingestao/tse/runner.py) exige
# TSE_SAFE_LOADER=1 exato pra rodar receitas/despesas; sem essa var, levanta
# SafeLoaderDisabled sem NENHUM fallback pro caminho antigo — o delete-before-load
# permanece INALCANÇÁVEL por execução normal.
#
# 2014 e 2016 (código migrado pro pipeline seguro em 2026-08-24, LegacyZipSource
# + testes unitários — ver ingestao/tse/legacy_source.py) continuam BLOQUEADOS
# em produção por uma SEGUNDA trava, independente de TSE_SAFE_LOADER: exigem
# TSE_LEGACY_APPROVED=1 (runner.py::_exigir_aprovacao_legado). Motivo: só os
# anos modernos foram homologados numa branch descartável com ZIP real — 2014/
# 2016 só têm cobertura de teste unitário (fakes) até agora, e são os mesmos
# anos do incidente de 2026-06-20. NÃO setar TSE_LEGACY_APPROVED=1 aqui sem
# aprovação humana separada, após homologar contra um ZIP real.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # Roda toda segunda de novembro/dezembro em anos eleitorais (pós-resultado)
    - cron: "0 8 * 11-12 1"
  workflow_dispatch:
    inputs:
      dataset:
        description: "Dataset a ingerir (receitas/despesas: 2018/2020/2022/2024 liberados — 2014/2016 exigem TSE_LEGACY_APPROVED=1, não setado)"
        type: choice
        options:
          - candidatos
          - todos
          - receitas
          - despesas
        default: candidatos
      anos:
        description: "Anos separados por espaço (ex: 2022 2024)"
        default: "2022 2024"

concurrency:
  group: ingest-tse
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180   # 2022: ~10min download + ~60min insert (500k receitas)

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Exige o valor exato "1" pro runner liberar receitas/despesas pelo
      # pipeline seguro (staging + swap atômico). Não é secret — é uma flag de
      # feature, ver ingestao/tse/runner.py::_exigir_safe_loader.
      TSE_SAFE_LOADER: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r ingestao/requirements.txt

      - name: Resolver parâmetros
        id: params
        run: |
          DATASET="${{ github.event.inputs.dataset || 'candidatos' }}"
          ANOS="${{ github.event.inputs.anos || '2022 2024' }}"
          echo "dataset=$DATASET" >> $GITHUB_OUTPUT
          echo "anos=$ANOS"       >> $GITHUB_OUTPUT
          echo "Ingerindo dataset=$DATASET anos=$ANOS"

      - name: Ingerir TSE
        run: |
          ANOS="${{ steps.params.outputs.anos }}"
          DATASET="${{ steps.params.outputs.dataset }}"
          ARGS="--dataset $DATASET"
          for ANO in $ANOS; do
            ARGS="$ARGS --ano $ANO"
          done
          python -m ingestao.tse.runner $ARGS
